name: Release

# Builds the release packages with the scripts in packaging/. A v* tag (it must equal
# v<[workspace.package] version>) builds every target and drafts a GitHub Release with them;
# a manual run builds the chosen targets as workflow artifacts only (or also drafts a release,
# with draft_release). Never on branch pushes or PRs: Actions minutes are limited, and macOS
# minutes cost 10x, Windows 2x. See packaging/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated: linux, web, windows, macos"
        type: string
        default: "linux,web,windows,macos"
      macos_arch:
        description: "macOS build: universal (release) or aarch64 (half the macOS minutes, for tests)"
        type: choice
        options: [universal, aarch64]
        default: universal
      draft_release:
        description: "Also draft a GitHub Release from the built targets"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: deskwerk-sheets
  APP_TITLE: Deskwerk Sheets
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  linux:
    if: github.event_name == 'push' || contains(inputs.targets, 'linux')
    # Oldest supported runner: the binaries need glibc >= the build host's (2.35 here).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/release-setup

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libfontconfig1-dev libfreetype-dev \
            zsync desktop-file-utils appstream

      - name: nfpm
        run: |
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          echo "787af76e172dd5fc7cedf4d7c5a090a2f62be9001557a4db1103e270f90ddefd  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
          nfpm --version

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-release
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}

      - name: Package
        run: packaging/linux/package.sh --formats "appimage deb rpm tar"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  web:
    if: github.event_name == 'push' || contains(inputs.targets, 'web')
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || fromJSON('["self-hosted", "deskwerk-fast"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/release-setup

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
          rustc --version

      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        if: runner.environment == 'github-hosted'
        with:
          tool: trunk@0.22.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          prefix-key: v1-release
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}

      - name: Package
        run: packaging/web/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  windows:
    if: github.event_name == 'push' || contains(inputs.targets, 'windows')
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # sign.ps1 signs only when one of these sets is complete; otherwise it warns and the MSI and
      # exes stay unsigned.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
    steps:
      # Keep LF endings: the translation patch and embedded text files expect them.
      - name: Git line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/release-setup

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target x86_64-pc-windows-msvc
          rustup default stable
          rustc --version

      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.Util.wixext/5.0.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-release
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}

      - name: Signing
        if: env.WINDOWS_CERTIFICATE == '' && env.AZURE_CLIENT_SECRET == ''
        run: echo "::warning::No Windows signing secrets; the MSI and exes are unsigned."

      - name: Package
        run: pwsh -NoProfile -File packaging/windows/package.ps1 -Arch x64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

      # Pictures of the installer wizard's pages, rendered by Windows Installer's dialog preview
      # from the MSI just built (nothing is installed).
      - name: Installer dialog previews
        run: |
          $msi = @(Get-ChildItem dist/release -Filter *.msi)
          if ($msi.Count -ne 1) { throw "Expected one MSI in dist/release, found $($msi.Count)." }
          pwsh -NoProfile -File packaging/windows/preview-installer-dialogs.ps1 -Msi $msi[0].FullName -OutputDir dist/installer-dialogs
          if ($LASTEXITCODE -ne 0) { throw 'Dialog previews failed.' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: installer-dialogs
          path: dist/installer-dialogs/*
          if-no-files-found: error
          retention-days: 7

      # The last release before the shared installer UI (0.16.4), for the upgrade test below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 31684d3ea1e84dd3cd3fe18400e0257709085f72
          path: legacy-installer
          sparse-checkout: |
            packaging/windows
            assets/app-icon
          persist-credentials: false

      # Installs fixture MSIs (no-op exes, the real packaging) on this disposable runner: desktop
      # shortcut default, explicit choices, repair, upgrades (also from 0.16.4), uninstall.
      - name: Installer desktop-shortcut smoke test
        run: pwsh -NoProfile -File packaging/windows/test-desktop-shortcut.ps1 -LegacySource "$env:GITHUB_WORKSPACE\legacy-installer"

  macos:
    if: github.event_name == 'push' || contains(inputs.targets, 'macos')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MACOS_ARCH: ${{ inputs.macos_arch || 'universal' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/release-setup

      - name: Rust
        run: |
          targets="--target aarch64-apple-darwin"
          if [ "$MACOS_ARCH" = universal ]; then targets="$targets --target x86_64-apple-darwin"; fi
          # shellcheck disable=SC2086
          rustup toolchain install stable --profile minimal --no-self-update $targets
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-release
          key: ${{ env.MACOS_ARCH }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}

      # Without APPLE_CERTIFICATE package.sh signs ad hoc and skips notarization.
      - name: Signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: packaging/macos/import-cert.sh

      - name: Package
        env:
          # Notarization runs only with a real identity and all three of these.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch "$MACOS_ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [linux, web, windows, macos]
    # Tag pushes need every build; a manual run with draft_release takes whatever it built.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (github.event_name == 'push' || inputs.draft_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)
          tag="v$version"
          cd dist
          ls -l
          [ -n "$(ls)" ] || { echo "::error::no artifacts to release"; exit 1; }
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists: replacing its assets"
            gh release upload "$tag" --clobber *
          else
            pre=()
            case "$version" in *-*) pre=(--prerelease) ;; esac
            gh release create "$tag" --draft "${pre[@]}" --target "$GITHUB_SHA" \
              --title "$APP_TITLE $tag" --generate-notes *
          fi
          echo "Draft: $(gh release view "$tag" --json url --jq .url)"
