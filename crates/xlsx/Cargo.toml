[package]
name = "deskwerk-sheets-xlsx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deskwerk Sheets file formats: XLSX (SpreadsheetML) and CSV import/export"

[lints]
workspace = true

[features]
# Builds password-encrypted workbooks in code for other crates' tests (a dev-dependency feature;
# never enabled in a shipped build).
test-support = []

[dependencies]
deskwerk-sheets-core = { workspace = true }
deskwerk-sheets-formula = { workspace = true }
deskwerk-sheets-math = { workspace = true }
deskwerk-sheets-model = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
aes = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Every registered function name, for the formula file-spelling test.
deskwerk-sheets-functions = { workspace = true }
